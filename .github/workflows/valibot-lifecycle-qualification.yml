name: Valibot Lifecycle Qualification
on:
  push:
    branches: ["codex/valibot-qualification-20261006"]
    paths: ["tests/valibot-lifecycle/**", ".github/workflows/valibot-lifecycle-qualification.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install isolated qualification dependencies
        run: npm install --prefix tests/valibot-lifecycle --ignore-scripts --no-audit --no-fund
      - name: Qualify behavior, native form, performance and reference recovery
        run: node tests/valibot-lifecycle/qualify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: valibot-lifecycle-${{ runner.os }}-${{ runner.arch }}
          path: |
            tests/valibot-lifecycle/*result.json
            tests/valibot-lifecycle/provenance.json
          if-no-files-found: error
