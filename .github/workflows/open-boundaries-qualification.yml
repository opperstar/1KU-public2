name: Open Boundary Qualification

on:
  push:
    branches:
      - main
    paths:
      - "tests/open-boundaries/**"
      - ".github/workflows/open-boundaries-qualification.yml"
  workflow_dispatch:

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-15
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install qualification dependency
        run: npm install --prefix tests/open-boundaries --package-lock=false --ignore-scripts

      - name: Run open-boundary qualification
        run: node tests/open-boundaries/controller.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-boundaries-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/open-boundaries-*.json
          if-no-files-found: error
