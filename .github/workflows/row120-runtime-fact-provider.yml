name: Row120 Runtime Fact Provider Qualification

on:
  push:
    branches:
      - main
    paths:
      - "tests/row120-runtime-fact-provider/**"
      - ".github/workflows/row120-runtime-fact-provider.yml"
  workflow_dispatch:

jobs:
  qualify:
    name: ${{ matrix.os }} provider qualification
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run provider qualification
        run: node tests/row120-runtime-fact-provider/controller.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: row120-runtime-fact-provider-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/row120-runtime-fact-provider-*.json
          if-no-files-found: error
