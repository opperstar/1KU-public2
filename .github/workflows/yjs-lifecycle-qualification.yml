name: Yjs Lifecycle Qualification
on:
  push:
    branches: ["codex/yjs-lifecycle-qualification-20261007"]
    paths: ["tests/yjs-lifecycle/**", ".github/workflows/yjs-lifecycle-qualification.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Reproduce actual current provider retention
        run: node --expose-gc tests/yjs-lifecycle/lifetime.cjs current
      - name: Qualify shared constructor identity and released business/doc/observer references
        run: node --expose-gc tests/yjs-lifecycle/lifetime.cjs candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yjs-lifecycle-${{ runner.os }}-${{ runner.arch }}
          path: |
            tests/yjs-lifecycle/*result.json
            tests/yjs-lifecycle/provenance.json
          if-no-files-found: error
