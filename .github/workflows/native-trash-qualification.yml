name: Native Trash Electron 43.3.0
on:
  push:
    branches: [codex/native-trash-qualification-20261001]
    paths: [tests/native-trash/**, .github/workflows/native-trash-qualification.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-trash:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Linux desktop runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11 libgtk-3-0 libnss3 libgbm1 libasound2t64 libnotify4
      - name: Install isolated Electron
        run: npm install --prefix tests/native-trash --package-lock=false
      - name: Real macOS remote main-process Trash
        if: runner.os == 'macOS'
        run: tests/native-trash/node_modules/.bin/electron tests/native-trash
      - name: Real Linux remote main-process Trash
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a tests/native-trash/node_modules/.bin/electron tests/native-trash --no-sandbox
      - name: Upload native OS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-trash-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/native-trash-*.json
          if-no-files-found: error
