name: UI Dependency Lifecycle Qualification
on:
  push:
    branches: ["codex/ui-dependency-qualification-20261007"]
    paths: ["tests/ui-dependency-lifecycle/**", ".github/workflows/ui-dependency-lifecycle-qualification.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tests/ui-dependency-lifecycle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-dependency-lifecycle-${{ runner.os }}-${{ runner.arch }}
          path: tests/ui-dependency-lifecycle/result-*.json
          if-no-files-found: error
