name: F1 Native Dependency Scope
on:
  push:
    branches: ['codex/f1-native-dependency-scope']
    paths:
      - 'qualification/f1-native-dependency-scope.mjs'
      - '.github/workflows/f1-native-dependency-scope.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing upstream fixture versions
        run: npm install --no-save --package-lock=false esbuild@0.28.2 watchpack@2.5.2 graceful-fs@4.2.11
      - name: Qualify synthetic scope, shared retry queue and actual native observation
        run: node qualification/f1-native-dependency-scope.mjs
