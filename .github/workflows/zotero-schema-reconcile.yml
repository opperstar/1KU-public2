name: Zotero Schema Reconcile Qualification

on:
  push:
    branches:
      - main
    paths:
      - "tests/zotero-schema-reconcile/**"
      - ".github/workflows/zotero-schema-reconcile.yml"
  workflow_dispatch:

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-15
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run Zotero schema reconcile qualification
        run: node tests/zotero-schema-reconcile/controller.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zotero-schema-reconcile-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/zotero-schema-reconcile-*.json
          if-no-files-found: error
